[project]
name = "sales-ai-service"
version = "2.0.0"
description = "AI and recommendation service for HappyShop"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10",
  "asyncmy>=0.2.10,<1",
  "fastapi>=0.116,<1",
  "google-genai>=1.33,<2",
  "numpy>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "qdrant-client>=1.17,<2",
  "scikit-learn>=1.7,<2",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
sales-ai-sync-catalog = "app.scripts.sync_catalog:main"
sales-ai-consume-catalog-events = "app.scripts.consume_catalog_events:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
